# https://gohugo.io/configuration/
# https://github.com/adityatelange/hugo-PaperMod/wiki

baseURL: https://juemuren.github.io/blog
locale: zh-cn
title: 无限能指
copyright: "&copy; Copyright 2026, **[Raind](https://github.com/Juemuren)**"
theme: PaperMod
mainSections: ["posts"]

googleAnalytics: G-79T7Y2J3Z6

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - $$
            - $$
          inline:
          - - $
            - $
        enable: true

outputFormats:
  llms:
    baseName: llms
    isPlainText: true
    mediaType: text/plain

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - ROBOTS
    - LLMS

services:
  rss:
    limit: -1

caches:
  images:
    dir: :cacheDir/images

languages:
  zh:
    label: 简体中文
    menu:
      main:
        - name: 主页
          url: /
          weight: 1
        - name: 合集
          url: /posts
          weight: 2
        - name: 类别
          url: /categories
          weight: 3
        - name: 标签
          url: /tags
          weight: 4
        - name: 搜索
          url: /search
          weight: 5
        - name: 归档
          url: /archives
          weight: 6
        - name: 关于
          url: /about
          weight: 7

params:
  env: production
  showToc: true
  tocOpen: true
  showFullTextinRSS: false
  showCodeCopyButtons: true
  showShareButtons: true
  showBreadCrumbs: false
  showPostNavLinks: true
  showWordCount: true
  showReadingTime: true
  hideFooter: false

  author: 冯玉
  description: 冯玉的个人博客
  assets:
    favicon: favicon.svg

  profileMode:
    enabled: true
    title: 无限能指
    subtitle: 在逻辑、思辨与诗意间滑动
    imageUrl: favicon.svg
    imageTitle: 无限能指
    imageWidth: 250
    imageHeight: 250
    buttons:
      - name: 合集
        url: posts
      - name: 关于
        url: about
      - name: 仓库
        url: https://github.com/juemuren/blog

  socialIcons:
    - name: github
      url: https://github.com/Juemuren
    - name: zhihu
      url: https://www.zhihu.com/people/yan-xi-2-31
