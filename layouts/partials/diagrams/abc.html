<script defer
  src="https://cdn.jsdelivr.net/npm/abcjs@6.6.3/dist/abcjs-basic-min.min.js"
  integrity="sha384-1NMuKXmc3uoL9DgYl4xk4m3wh/VSSJ1jKVsNjFu882heXeNSw4jT87kw5VCA7ELC"
  crossorigin="anonymous">
</script>
<script>
function renderDiagram(source, index) {
  const container = document.createElement("div");
  container.id = `abc-diagram-${index + 1}`;
  container.className = "abc-container";
  source.replaceWith(container);

  const code = source.textContent.trim();
  ABCJS.renderAbc(container.id, code, {
    responsive: "resize",
    selectTypes: false,
    oneSvgPerLine: true,
  });
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("pre.abc").forEach(renderDiagram);
});
</script>
<style>
.abc-container {
  margin: var(--content-gap) auto;
}
</style>
